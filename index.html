<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마장 진로 포트폴리오 제출</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- html2pdf for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Professional Font (Pretendard) -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc; /* slate-50 */
            color: #0f172a; /* slate-900 */
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        textarea { resize: none; }

        /* 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* PDF 미리보기를 위한 스케일링 래퍼 */
        .pdf-preview-wrapper {
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f1f5f9;
            padding: 2rem 1rem;
            border-radius: 1rem;
            border: 1px solid #e2e8f0;
        }
        .pdf-scale-container {
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border-radius: 0.75rem;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, collection, addDoc, getDocs, onSnapshot, query, orderBy, serverTimestamp
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Firebase Mock Variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'majang-portfolio-app';
        
        // --- Modals ---
        
        // 선생님 비밀번호 모달
        const PasswordModal = ({ isOpen, onClose, onSuccess }) => {
            const [pwd, setPwd] = useState('');
            const [error, setError] = useState(false);

            if (!isOpen) return null;

            const handleSubmit = (e) => {
                e.preventDefault();
                if (pwd === '1234') {
                    setPwd(''); setError(false); onSuccess(); onClose();
                } else {
                    setError(true); setPwd('');
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-8 animate-fade-in">
                        <div className="text-center mb-6">
                            <div className="w-12 h-12 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center mx-auto mb-3">
                                <i data-lucide="lock" className="w-6 h-6"></i>
                            </div>
                            <h3 className="text-xl font-bold text-slate-900">교사 인증</h3>
                            <p className="text-slate-500 text-sm mt-1">접근 비밀번호를 입력해주세요.</p>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <input 
                                type="password" value={pwd} onChange={(e) => setPwd(e.target.value)}
                                className="w-full px-4 py-3 rounded-lg bg-slate-50 border border-slate-300 focus:border-blue-600 focus:ring-2 focus:ring-blue-200 outline-none text-center text-xl tracking-widest transition-all mb-2"
                                placeholder="****" autoFocus
                            />
                            {error && <p className="text-red-500 text-sm text-center mb-4">비밀번호가 일치하지 않습니다.</p>}
                            <div className="flex gap-2 mt-6">
                                <button type="button" onClick={onClose} className="flex-1 py-3 rounded-lg bg-slate-100 text-slate-700 font-semibold hover:bg-slate-200 transition-colors">취소</button>
                                <button type="submit" className="flex-1 py-3 rounded-lg bg-slate-900 text-white font-semibold hover:bg-slate-800 transition-colors">확인</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // 제출 확인 모달
        const ConfirmModal = ({ isOpen, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                    <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-8 animate-fade-in text-center">
                        <div className="w-12 h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="send" className="w-6 h-6 ml-1"></i>
                        </div>
                        <h3 className="text-xl font-bold text-slate-900 mb-2">최종 제출 확인</h3>
                        <p className="text-slate-600 text-sm mb-8 font-medium">{message}</p>
                        <div className="flex gap-3 w-full">
                            <button onClick={onCancel} className="flex-1 py-3 rounded-lg bg-slate-100 text-slate-700 font-semibold hover:bg-slate-200 transition-colors">수정하기</button>
                            <button onClick={onConfirm} className="flex-1 py-3 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 transition-colors">제출하기</button>
                        </div>
                    </div>
                </div>
            );
        };

        // 홈으로 이동(초기화) 확인 모달
        const ResetConfirmModal = ({ isOpen, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                    <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-8 animate-fade-in text-center">
                        <div className="w-12 h-12 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="home" className="w-6 h-6"></i>
                        </div>
                        <h3 className="text-xl font-bold text-slate-900 mb-2">첫 화면으로 이동</h3>
                        <p className="text-slate-600 text-sm mb-6 font-medium">작성된 모든 내용이 초기화되고<br/>첫 화면(회사 선택)으로 이동합니다.</p>
                        <div className="flex gap-3 w-full">
                            <button onClick={onCancel} className="flex-1 py-3 rounded-lg bg-slate-100 text-slate-700 font-semibold hover:bg-slate-200 transition-colors">취소</button>
                            <button onClick={onConfirm} className="flex-1 py-3 rounded-lg bg-slate-900 text-white font-semibold hover:bg-slate-800 transition-colors">확인</button>
                        </div>
                    </div>
                </div>
            );
        };

        // 알림 모달
        const AlertModal = ({ isOpen, message, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                    <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 animate-fade-in text-center">
                        <div className="w-12 h-12 rounded-full bg-red-50 text-red-500 flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="alert-circle" className="w-6 h-6"></i>
                        </div>
                        <p className="text-slate-800 text-sm mb-6 font-semibold whitespace-pre-wrap">{message}</p>
                        <button onClick={onClose} className="w-full py-3 rounded-lg bg-slate-900 text-white font-semibold hover:bg-slate-800 transition-colors">확인</button>
                    </div>
                </div>
            );
        };

        // 회사 선택 모달
        const CompanyConfirmModal = ({ isOpen, company, onConfirm, onCancel }) => {
            if (!isOpen || !company) return null;

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [isOpen, company]);

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                    <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 animate-fade-in text-center">
                        <div className={`w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 ${company.color}`}>
                            <i data-lucide={company.icon} className="w-8 h-8"></i>
                        </div>
                        <h3 className="text-2xl font-bold text-slate-900 mb-2">{company.name}</h3>
                        <p className="text-slate-600 text-md mb-8 font-medium">이 회사에 진로 포트폴리오(입사 지원서)를<br/>작성하시겠습니까?</p>
                        <div className="flex gap-3 w-full">
                            <button onClick={onCancel} className="flex-1 py-3 rounded-lg bg-slate-100 text-slate-700 font-semibold hover:bg-slate-200 transition-colors">다른 회사 보기</button>
                            <button onClick={() => onConfirm(company)} className="flex-1 py-3 rounded-lg bg-slate-900 text-white font-semibold hover:bg-slate-800 transition-colors">작성 시작하기</button>
                        </div>
                    </div>
                </div>
            );
        };

        const companies = [
            { id: 'it', name: 'IT 혁신 기업', icon: 'cpu', desc: '소프트웨어, AI, 데이터 분석', color: 'bg-blue-100 text-blue-600', border: 'hover:border-blue-500' },
            { id: 'art', name: '디자인 스튜디오', icon: 'pen-tool', desc: '미술, 시각디자인, 콘텐츠 창작', color: 'bg-purple-100 text-purple-600', border: 'hover:border-purple-500' },
            { id: 'health', name: '스마트 종합 병원', icon: 'stethoscope', desc: '의료, 보건, 생명과학', color: 'bg-emerald-100 text-emerald-600', border: 'hover:border-emerald-500' },
            { id: 'biz', name: '글로벌 스타트업', icon: 'rocket', desc: '경영, 기획, 마케팅, 창업', color: 'bg-orange-100 text-orange-600', border: 'hover:border-orange-500' },
            { id: 'edu', name: '공공 교육 기관', icon: 'landmark', desc: '교육, 행정, 사회복지', color: 'bg-indigo-100 text-indigo-600', border: 'hover:border-indigo-500' },
            { id: 'free', name: '프리랜서 그룹', icon: 'laptop', desc: '자유 전공, 새로운 직업 탐색', color: 'bg-slate-100 text-slate-600', border: 'hover:border-slate-500' },
        ];

        const CompanySelection = ({ onSelect }) => {
            const [selectedForConfirm, setSelectedForConfirm] = useState(null);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, []);

            return (
                <div className="max-w-5xl mx-auto w-full pt-12 pb-20 px-4">
                    <div className="text-center mb-16 animate-fade-in">
                        <span className="inline-block py-1 px-3 rounded-full bg-slate-100 text-slate-600 text-sm font-bold tracking-wider mb-4">STEP 1</span>
                        <h2 className="text-3xl md:text-4xl font-extrabold text-slate-900 mb-4 tracking-tight">지원할 회사를 선택해주세요</h2>
                        <p className="text-slate-500 text-lg">여러분의 꿈이 현실이 될 첫 번째 직장을 골라보세요.</p>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {companies.map((company) => (
                            <button 
                                key={company.id}
                                onClick={() => setSelectedForConfirm(company)}
                                className={`group bg-white p-8 rounded-2xl shadow-sm hover:shadow-xl border-2 border-slate-100 transition-all duration-300 text-left flex flex-col items-start animate-fade-in ${company.border}`}
                            >
                                <div className={`w-14 h-14 rounded-xl flex items-center justify-center mb-6 transition-transform duration-300 group-hover:scale-110 ${company.color}`}>
                                    <i data-lucide={company.icon} className="w-7 h-7"></i>
                                </div>
                                <h3 className="text-xl font-bold text-slate-900 mb-2">{company.name}</h3>
                                <p className="text-slate-500 text-sm leading-relaxed">{company.desc}</p>
                            </button>
                        ))}
                    </div>

                    <CompanyConfirmModal 
                        isOpen={!!selectedForConfirm}
                        company={selectedForConfirm}
                        onCancel={() => setSelectedForConfirm(null)}
                        onConfirm={(comp) => {
                            setSelectedForConfirm(null);
                            onSelect(comp);
                        }}
                    />
                </div>
            );
        };

        const Header = ({ isTeacherMode, setIsTeacherMode }) => {
            const [showPwdModal, setShowPwdModal] = useState(false);

            return (
                <header className="bg-white border-b border-slate-200 sticky top-0 z-50">
                    <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center">
                                <i data-lucide="briefcase" className="w-4 h-4 text-white"></i>
                            </div>
                            <h1 className="text-lg font-bold text-slate-900 tracking-tight">마장 진로 포트폴리오</h1>
                        </div>
                        <button 
                            onClick={() => isTeacherMode ? setIsTeacherMode(false) : setShowPwdModal(true)}
                            className={`px-4 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center gap-2 ${
                                isTeacherMode 
                                ? 'bg-slate-900 text-white hover:bg-slate-800' 
                                : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                            }`}
                        >
                            <i data-lucide={isTeacherMode ? "log-out" : "shield"} className="w-4 h-4"></i>
                            {isTeacherMode ? '학생 화면으로' : '선생님 용'}
                        </button>
                    </div>
                    <PasswordModal 
                        isOpen={showPwdModal} 
                        onClose={() => setShowPwdModal(false)}
                        onSuccess={() => setIsTeacherMode(true)}
                    />
                </header>
            );
        };

        const TeacherDashboard = () => {
            return (
                <div className="max-w-6xl mx-auto p-8 animate-fade-in">
                    <div className="flex items-center gap-3 mb-8">
                        <div className="w-10 h-10 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center">
                            <i data-lucide="users" className="w-5 h-5"></i>
                        </div>
                        <h2 className="text-2xl font-bold text-slate-900">제출된 포트폴리오 관리</h2>
                    </div>
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-12 text-center text-slate-500">
                        <i data-lucide="inbox" className="w-16 h-16 mx-auto mb-4 text-slate-300"></i>
                        <p className="text-lg">현재 연결된 데이터베이스가 없어 임시 대시보드만 표시됩니다.<br/>(실제 연동 시 학생들의 지원서 목록이 이곳에 나타납니다.)</p>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isTeacherMode, setIsTeacherMode] = useState(false);
            const [selectedCompany, setSelectedCompany] = useState(null);
            
            // Form state
            const [name, setName] = useState('');
            const [jobTitle, setJobTitle] = useState('');
            const [imagePreview, setImagePreview] = useState(null);
            
            const [q1, setQ1] = useState(''); 
            const [q2, setQ2] = useState(''); 
            const [q3, setQ3] = useState(''); 
            const [q4, setQ4] = useState(''); 
            const [q5, setQ5] = useState(''); 

            const [showConfirm, setShowConfirm] = useState(false);
            const [showResetConfirm, setShowResetConfirm] = useState(false);
            const [alertMessage, setAlertMessage] = useState('');
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);
            
            // 태블릿 전시 & TAG 피드백 관련 상태
            const [shareMode, setShareMode] = useState('none'); // 'none' | 'card' | 'resume' | 'tag_form' | 'results'
            const [feedbacks, setFeedbacks] = useState([]);
            
            // TAG 입력 폼 상태
            const [evalAuthor, setEvalAuthor] = useState('');
            const [evalT, setEvalT] = useState(''); // Tell (칭찬)
            const [evalA, setEvalA] = useState(''); // Ask (질문)
            const [evalG, setEvalG] = useState(''); // Give (조언)
            const [evalSuccess, setEvalSuccess] = useState(false);

            const pdfRef = useRef(null);
            const previewContainerRef = useRef(null);
            const [scale, setScale] = useState(0.5);

            // Re-initialize icons on renders
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [isTeacherMode, selectedCompany, isSubmitted, imagePreview, shareMode, feedbacks, evalSuccess, showConfirm, showResetConfirm, alertMessage]);

            // Calculate responsive scale for PDF preview
            useEffect(() => {
                if (isSubmitted && previewContainerRef.current) {
                    const updateScale = () => {
                        const containerWidth = previewContainerRef.current.offsetWidth - 48; // 여백 제외 실사이즈
                        const newScale = Math.min(containerWidth / 1280, 1);
                        setScale(newScale > 0 ? newScale : 0.5);
                    };
                    updateScale();
                    window.addEventListener('resize', updateScale);
                    return () => window.removeEventListener('resize', updateScale);
                }
            }, [isSubmitted]);

            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setImagePreview(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmitClick = (e) => {
                e.preventDefault();
                if (!name || !jobTitle || !imagePreview || !q1 || !q2 || !q3 || !q4 || !q5) {
                    setAlertMessage('모든 항목을 작성하고 명함을 업로드해주세요.');
                    return;
                }
                setShowConfirm(true);
            };

            const handleConfirmSubmit = () => {
                setShowConfirm(false);
                setIsSubmitted(true);
                window.scrollTo(0, 0);
            };

            const handleResetClick = () => {
                setShowResetConfirm(true);
            };

            const handleConfirmReset = () => {
                setShowResetConfirm(false);
                setIsSubmitted(false);
                setSelectedCompany(null);
                setName(''); setJobTitle(''); setImagePreview(null);
                setQ1(''); setQ2(''); setQ3(''); setQ4(''); setQ5('');
                setFeedbacks([]);
                setShareMode('none');
                window.scrollTo(0, 0);
            };

            // 작성 내용의 총 글자 수 계산하여 PDF 레이아웃 스타일 동적 적용
            const totalTextLength = (q1 + q2 + q3 + q4 + q5).length;
            
            // 글자 수에 따른 동적 스타일 레벨
            const getTextStyle = () => {
                if (totalTextLength > 450) {
                    return {
                        padding: 'p-6',
                        headerMb: 'mb-3 pb-2',
                        headerText: 'text-2xl',
                        spaceY: 'space-y-1',
                        itemPb: 'pb-1.5',
                        tagText: 'text-[10px] px-2 py-0.5',
                        qText: 'text-xs',
                        aText: 'text-[11px] leading-tight'
                    };
                } else if (totalTextLength > 250) {
                    return {
                        padding: 'p-8',
                        headerMb: 'mb-4 pb-3',
                        headerText: 'text-2xl',
                        spaceY: 'space-y-2',
                        itemPb: 'pb-2',
                        tagText: 'text-xs px-2.5 py-0.5',
                        qText: 'text-xs',
                        aText: 'text-xs leading-snug'
                    };
                } else {
                    return {
                        padding: 'p-12',
                        headerMb: 'mb-8 pb-4',
                        headerText: 'text-3xl',
                        spaceY: 'space-y-3',
                        itemPb: 'pb-4',
                        tagText: 'text-xs px-3 py-1',
                        qText: 'text-md',
                        aText: 'text-md leading-relaxed'
                    };
                }
            };

            const pdfStyle = getTextStyle();

            // TAG 피드백 제출
            const handleTagSubmit = (e) => {
                e.preventDefault();
                if (!evalAuthor.trim() || !evalT.trim() || !evalA.trim() || !evalG.trim()) {
                    setAlertMessage('모든 평가 항목과 작성자 이름을 작성해주세요!');
                    return;
                }
                const newFB = {
                    id: Date.now(),
                    author: evalAuthor,
                    t: evalT,
                    a: evalA,
                    g: evalG,
                    date: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
                };
                setFeedbacks([newFB, ...feedbacks]);
                setEvalT(''); setEvalA(''); setEvalG(''); setEvalAuthor('');
                setEvalSuccess(true);
            };

            const generatePDF = async () => {
                if(isGeneratingPDF) return;
                setIsGeneratingPDF(true);
                
                let container = null;
                try {
                    const originalElement = pdfRef.current;
                    const clone = originalElement.cloneNode(true);
                    
                    container = document.createElement('div');
                    container.style.position = 'fixed';
                    container.style.left = '0';
                    container.style.top = '0';

                                            {[
                                                { q: "1. 2045년, 내가 살아갈 미래 사회는 지금과 어떻게 달라져 있을까요?", a: q1, tag: "2045 미래사회", sub: "어떤 과학 기술이나 변화 때문에 그렇게 달라질지 함께 써 보세요." },
                                                { q: "2. 그런 미래 사회에는 어떤 새로운 문제나 필요가 생길까요?", a: q2, tag: "새로운 문제/필요", sub: "미래 사회의 변화 때문에 사람들이 겪게 될 어려움이나 새롭게 필요해지는 것을 생각해 보세요." },
                                                { q: "3. 그 문제를 해결하는 데 어떤 과학 기술이 도움을 줄 수 있나요?", a: q3, tag: "과학기술 해결", sub: "어떤 기술이 어떻게 도움을 줄 수 있는지 이유와 함께 써 보세요." },
                                                { q: "4. 2045년의 나는 어떤 직업을 가지고 있나요?", a: q4, tag: "2045 나의 직업", sub: "그 직업이 지금과 비교하여 어떻게 달라져 있을지도 생각해 보세요." },
                                                { q: "5. 내가 꿈꾸는 직업에는 어떤 과학적 요소가 숨어있나요?", a: q5, tag: "직업 속 과학원리", sub: "내 직업에서 활용되는 과학 원리, 과학 지식, 과학 기술을 찾아보고, 실제로 어떻게 활용되는지 설명해 보세요." }
                                            ].map((item, idx) => (
                                                <div key={idx} className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
                                                    <div className="flex items-center gap-3 mb-2">
                                                        <span className="text-xs font-black text-white bg-blue-600 px-3 py-1 rounded-full whitespace-nowrap">{item.tag}</span>
                                                        <h4 className="font-bold text-white text-base md:text-lg">{item.q}</h4>
                                                    </div>
                                                    <p className="text-xs text-slate-400 mb-3 pl-1">→ {item.sub}</p>
                                                    <p className="text-slate-300 text-sm md:text-base leading-relaxed whitespace-pre-wrap pl-1">{item.a}</p>
                                                </div>
                                            ))}

                                            <div className="pt-6 text-center">
                                                <button 
                                                    onClick={() => setShareMode('tag_form')}
                                                    className="w-full sm:w-auto px-10 py-5 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 rounded-2xl font-black text-lg text-white shadow-2xl transition-all hover:scale-105 active:scale-95 inline-flex items-center justify-center gap-3 cursor-pointer"
                                                >
                                                    <i data-lucide="message-square-plus" className="w-6 h-6"></i>
                                                    <span>피드백 남기러 가기 (TAG 평가)</span>
                                                    <i data-lucide="arrow-right" className="w-6 h-6"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Panel 3: TAG 피드백 작성 Form */}
                                    <div className="w-[33.333333%] h-full overflow-y-auto bg-slate-950 text-slate-900 p-6 md:p-12 flex flex-col items-center justify-center">
                                        <div className="bg-white w-full max-w-3xl rounded-3xl p-6 md:p-10 shadow-2xl my-auto border border-slate-200">
                                            <div className="flex items-center justify-between border-b border-slate-200 pb-4 mb-6">
                                                <div>
                                                    <span className="text-xs font-black text-indigo-600 bg-indigo-50 px-3.5 py-1.5 rounded-full uppercase tracking-wider">TAG Evaluation</span>
                                                    <h3 className="text-2xl md:text-3xl font-extrabold text-slate-900 mt-2">{name} 친구에게 피드백 남기기</h3>
                                                </div>
                                                <button 
                                                    onClick={() => setShareMode('resume')}
                                                    className="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold text-xs hover:bg-slate-200 transition-colors flex items-center gap-1.5 cursor-pointer"
                                                >
                                                    <i data-lucide="arrow-left" className="w-4 h-4"></i> 이력서 보기
                                                </button>
                                            </div>

                                            {evalSuccess ? (
                                                <div className="text-center py-12">
                                                    <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                                        <i data-lucide="check-circle-2" className="w-10 h-10"></i>
                                                    </div>
                                                    <h4 className="text-2xl font-bold text-slate-900 mb-2">평가가 성공적으로 등록되었습니다!</h4>
                                                    <p className="text-slate-500 mb-8 text-sm">친구에게 큰 도움이 될 거예요. 고마워요!</p>
                                                    <div className="flex gap-4 justify-center">
                                                        <button 
                                                            onClick={() => { setEvalSuccess(false); setShareMode('card'); }}
                                                            className="px-6 py-3.5 rounded-xl bg-indigo-600 text-white text-sm font-bold hover:bg-indigo-700 transition-colors flex items-center gap-2 shadow-lg cursor-pointer"
                                                        >
                                                            <i data-lucide="rotate-ccw" className="w-4 h-4"></i> 처음 명함 보기
                                                        </button>
                                                        <button 
                                                            onClick={() => { setEvalSuccess(false); setShareMode('none'); }}
                                                            className="px-6 py-3.5 rounded-xl bg-slate-900 text-white text-sm font-bold hover:bg-slate-800 transition-colors shadow-lg cursor-pointer"
                                                        >
                                                            공유 종료
                                                        </button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <form onSubmit={handleTagSubmit} className="space-y-5">
                                                    <div>
                                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1.5">작성자 (내 이름)</label>
                                                        <input 
                                                            type="text" value={evalAuthor} onChange={(e) => setEvalAuthor(e.target.value)}
                                                            className="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-300 focus:border-indigo-500 outline-none text-sm font-semibold"
                                                            placeholder="예: 김민준" required
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-bold text-blue-600 uppercase mb-1.5 flex items-center gap-1.5">
                                                            <span className="w-5 h-5 bg-blue-100 text-blue-600 rounded-full inline-flex items-center justify-center font-black text-xs">T</span> Tell (칭찬할 점)
                                                        </label>
                                                        <input 
                                                            type="text" value={evalT} onChange={(e) => setEvalT(e.target.value)}
                                                            className="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-300 focus:border-blue-500 outline-none text-sm"
                                                            placeholder="멋진 점이나 잘 작성한 부분을 칭찬해주세요!" required
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-bold text-amber-600 uppercase mb-1.5 flex items-center gap-1.5">
                                                            <span className="w-5 h-5 bg-amber-100 text-amber-600 rounded-full inline-flex items-center justify-center font-black text-xs">A</span> Ask (궁금한 점)
                                                        </label>
                                                        <input 
                                                            type="text" value={evalA} onChange={(e) => setEvalA(e.target.value)}
                                                            className="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-300 focus:border-amber-500 outline-none text-sm"
                                                            placeholder="이 진로나 포트폴리오 내용 중 궁금한 점을 물어보세요!" required
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-bold text-emerald-600 uppercase mb-1.5 flex items-center gap-1.5">
                                                            <span className="w-5 h-5 bg-emerald-100 text-emerald-600 rounded-full inline-flex items-center justify-center font-black text-xs">G</span> Give (알려주고 싶은 점 / 조언)
                                                        </label>
                                                        <input 
                                                            type="text" value={evalG} onChange={(e) => setEvalG(e.target.value)}
                                                            className="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-300 focus:border-emerald-500 outline-none text-sm"
                                                            placeholder="더 발전시킬 수 있는 아이디어나 도움이 될 정보를 공유해주세요!" required
                                                        />
                                                    </div>

                                                    <div className="flex gap-3 pt-4 border-t border-slate-200">
                                                        <button 
                                                            type="button" onClick={() => setShareMode('resume')}
                                                            className="flex-1 py-3.5 rounded-xl bg-slate-100 text-slate-700 font-bold hover:bg-slate-200 transition-colors flex items-center justify-center gap-1.5 text-sm cursor-pointer"
                                                        >
                                                            <i data-lucide="arrow-left" className="w-4 h-4"></i> 이력서 보기
                                                        </button>
                                                        <button 
                                                            type="submit"
                                                            className="flex-1 py-3.5 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 transition-colors shadow-xl text-sm flex items-center justify-center gap-1.5 cursor-pointer"
                                                        >
                                                            <i data-lucide="send" className="w-4 h-4"></i> 평가 등록하기
                                                        </button>
                                                    </div>
                                                </form>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 공유 결과 확인하기 (TAG 피드백 모달) */}
                    {shareMode === 'results' && (
                        <div className="fixed inset-0 z-[200] bg-slate-950/70 backdrop-blur-md flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl shadow-2xl max-w-3xl w-full max-h-[85vh] flex flex-col p-8 animate-fade-in border border-slate-100">
                                <div className="flex items-center justify-between border-b border-slate-100 pb-4 mb-6">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center font-bold">
                                            <i data-lucide="message-square" className="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <h3 className="text-xl font-bold text-slate-900">친구들이 남겨준 TAG 피드백</h3>
                                            <p className="text-xs text-slate-500">총 {feedbacks.length}개의 응원이 도착했습니다.</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setShareMode('none')}
                                        className="p-2 hover:bg-slate-100 rounded-full text-slate-500 transition-colors cursor-pointer"
                                    >
                                        <i data-lucide="x" className="w-6 h-6"></i>
                                    </button>
                                </div>

                                <div className="flex-grow overflow-y-auto space-y-4 pr-1">
                                    {feedbacks.length === 0 ? (
                                        <div className="text-center py-16 text-slate-400">
                                            <i data-lucide="inbox" className="w-12 h-12 mx-auto mb-3 opacity-50"></i>
                                            <p className="font-semibold text-sm">아직 남겨진 피드백이 없습니다.</p>
                                            <p className="text-xs text-slate-400 mt-1">'내 진로 공유하기'를 눌러 친구들에게 내 명함을 보여주세요!</p>
                                        </div>
                                    ) : (
                                        feedbacks.map((fb) => (
                                            <div key={fb.id} className="p-5 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
                                                <div className="flex justify-between items-center border-b border-slate-200/60 pb-2">
                                                    <span className="font-bold text-slate-900 text-sm flex items-center gap-1.5">
                                                        <i data-lucide="user" className="w-4 h-4 text-indigo-500"></i> {fb.author} 친구
                                                    </span>
                                                    <span className="text-xs text-slate-400">{fb.date}</span>
                                                </div>
                                                <div className="space-y-2 text-sm">
                                                    <div className="flex gap-2 items-start">
                                                        <span className="px-2 py-0.5 rounded bg-blue-100 text-blue-700 text-xs font-black shrink-0 mt-0.5">T</span>
                                                        <p className="text-slate-700"><span className="font-semibold text-blue-900">칭찬:</span> {fb.t}</p>
                                                    </div>
                                                    <div className="flex gap-2 items-start">
                                                        <span className="px-2 py-0.5 rounded bg-amber-100 text-amber-700 text-xs font-black shrink-0 mt-0.5">A</span>
                                                        <p className="text-slate-700"><span className="font-semibold text-amber-900">질문:</span> {fb.a}</p>
                                                    </div>
                                                    <div className="flex gap-2 items-start">
                                                        <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-700 text-xs font-black shrink-0 mt-0.5">G</span>
                                                        <p className="text-slate-700"><span className="font-semibold text-emerald-900">조언:</span> {fb.g}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                <div className="mt-6 pt-4 border-t border-slate-100 text-right">
                                    <button 
                                        onClick={() => setShareMode('none')}
                                        className="px-6 py-2.5 rounded-xl bg-slate-900 text-white font-bold text-sm hover:bg-slate-800 transition-colors cursor-pointer"
                                    >
                                        닫기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <ConfirmModal 
                        isOpen={showConfirm}
                        message="제출 버튼을 누르면 수정할 수 없습니다. 제출하시겠습니까?"
                        onConfirm={handleConfirmSubmit}
                        onCancel={() => setShowConfirm(false)}
                    />
                    <ResetConfirmModal 
                        isOpen={showResetConfirm}
                        onConfirm={handleConfirmReset}
                        onCancel={() => setShowResetConfirm(false)}
                    />
                    <AlertModal 
                        isOpen={!!alertMessage}
                        message={alertMessage}
                        onClose={() => setAlertMessage('')}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
